name: LCSC conversion backend

on:
  workflow_dispatch:
    inputs:
      lcsc_id:
        description: LCSC component ID
        required: true
        type: string
      request_id:
        description: Unique request identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out converter wrapper
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install easyeda2kicad
        run: python -m pip install --disable-pip-version-check "easyeda2kicad @ git+https://github.com/uPesy/easyeda2kicad.py@fff10a38619963d7cb1c57d779655a9ea4572e95"
      - name: Convert LCSC component
        env:
          INPUT_LCSC_ID: ${{ inputs.lcsc_id }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          OUTPUT_DIR: lcsc-convert-output
        run: node scripts/convert-lcsc.mjs
      - name: Return result
        uses: actions/upload-artifact@v4
        with:
          name: lcsc-convert-${{ inputs.request_id }}
          path: lcsc-convert-output
          retention-days: 1
          if-no-files-found: error
