name: Link fetch backend

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public component page or asset URL
        required: true
        type: string
      request_id:
        description: Unique request identifier
        required: true
        type: string
      suggested_name:
        description: Optional filename or format hint
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out fetcher
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install LCSC converter
        run: python -m pip install --disable-pip-version-check "easyeda2kicad @ git+https://github.com/uPesy/easyeda2kicad.py@fff10a38619963d7cb1c57d779655a9ea4572e95"
      - name: Fetch public link
        env:
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_SUGGESTED_NAME: ${{ inputs.suggested_name }}
          OUTPUT_DIR: link-fetch-output
        run: node scripts/fetch-link.mjs
      - name: Return result
        uses: actions/upload-artifact@v4
        with:
          name: link-fetch-${{ inputs.request_id }}
          path: link-fetch-output
          retention-days: 1
          if-no-files-found: error
